[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-vai"
version = "6.4.0"
description = "A bounded-memory streaming engine designed for predictable resource usage under variable workloads."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Nguyen Vo Anh Khoa" },
]
keywords = ["streaming", "lz4", "bounded-memory", "backpressure", "edge-ai", "data-pipeline"]
dependencies = [
    "lz4>=4.3.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
zstd = ["zstandard>=0.22.0"]
bench = [
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "tiktoken>=0.7.0",
    "zstandard>=0.22.0",
]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
